# ─────────────────────────────────────────────────────────────────────────────
# 测试 profile 配置（user 域 · api + rpc 合并后的单一进程）
# ─────────────────────────────────────────────────────────────────────────────
#
# 🔴 **为什么必须自带密钥**（fail-closed 纪律）：
#   主配置 `application.yml` 的
#     user-api.user-auth.access-secret: ${USER_JWT_SECRET}
#     user-rpc.user-auth.access-secret: ${USER_JWT_SECRET}
#   **没有明文默认值** ⇒ 环境变量没设时启动即失败（这是 B 侧的 fail-closed，**不得**在本仓偷偷加默认值）
#   ⇒ ⇒ 测试必须**自带**密钥，否则整个测试上下文起不来。
#
# ⚠️ 本文件是 **test scope**（只进 target/test-classes）⇒ **不进产物 jar**
#    ⇒ ⇒ 生产 / 部署**拿不到**这个默认值 ⇒ ⇒ 生产必须由环境变量提供。
#
# ⚠️ 值必须与测试里签发 token 的常量一致
#    （`UserApiHttpContractTest#SECRET`）⇒ 否则验签必失败（401）。
# ⚠️ **长度 36 字节**（UUID 形态）：jjwt 要求 HMAC 密钥 ≥32 字节
#    ⇒ 共享层 `JwtUtil.padToHmacKeySize` 会补齐 ⇒ 长度本身是被测的不变量 ⇒ 不要换成别的长度。
user-api.user-auth.access-secret=ae0536f9-6450-4606-8e13-5a19ed505da0
user-rpc.user-auth.access-secret=ae0536f9-6450-4606-8e13-5a19ed505da0

# ─────────────────────────────────────────────────────────────────────────────
# gRPC：**不起 TCP 端口**
#   `grpc.server.port=-1` ⇒ devh 的 `ConditionalOnInterprocessServer` 不匹配
#   ⇒ **netty server 不创建** ⇒ 不占 TCP 端口 ⇒ 多测试上下文并存时**不撞端口**。
#
# ⚠️ **默认不起 in-process server**：gRPC 的 in-process server 名字是 **JVM 内全局注册**的
#   （`IOException: name already registered`）⇒ 多个 Spring 上下文用同一个名字 ⇒ 第二个起不来
#   ⇒ ⇒ 只有需要真 gRPC 的测试类才在**自己的** `@SpringBootTest(properties=...)` 里指定唯一名字。
# ⚠️ in-process server **仍然是真 gRPC server**：starter 的 `GrpcServiceDiscoverer` 扫描
#    `@GrpcService` → 注册 service definition → 真实分发 + **真实的拦截器链**
#    （共享层 `ProtectionAutoConfiguration#seaGrpcServerConfigurer` 挂的那条）。
# ─────────────────────────────────────────────────────────────────────────────
grpc.server.port=-1

# ─────────────────────────────────────────────────────────────────────────────
# Redis：本机没有 Redis ⇒ 指向**关闭的**端口 ⇒ 连接**立即**被拒（毫秒级）
#   ⇒ 黑名单检查走 fail-open 分支（与 B 侧「Redis 故障不阻塞业务」逐字一致）。
# ⚠️ 这里**不是** mock：真实 Lettuce ⇒ 真实异常 ⇒ 真实 fail-open 分支。
# ─────────────────────────────────────────────────────────────────────────────
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
