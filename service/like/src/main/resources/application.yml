# =============================================================================
# like 域的**配置入口**（S1 · 5 进程形态）
#
# 【为什么有这份文件】域的真配置在 `application-like.yml`（**与 B 侧逐条一致**）⇒
#   本文件只做一件事：**把那份真配置 import 进来**。
#
# 【为什么必须改名】Spring Boot 在 classpath 上**只加载第一个** `application.yml`
#   ⇒ ⇒ 10 个域各有 1 份 `application.yml` 时，合并进程里**只有一份生效**
#   ⇒ ⇒ 实测症状（2026-11-28 · S1）：`user-service` 进程里 `user-api.*` 段生效，
#        **但 `admin-api.admin-auth.access-secret` 整段丢失** ⇒
#        `AdminApiProperties` 的 fail-closed 守卫抛「access-secret 不能为空」。
#   ⇒ ⇒ 解法：域的真配置改名 `application-like.yml`（**内容一字未动**），
#        本文件 + 各进程 boot 模块的 `application.yml` 用 `spring.config.import` 导入。
#
# 【两种运行形态下各自生效的是谁】（实测 classpath 顺序）
#   ① **域独立跑 / 域自己的测试**（classpath 上只有本域这一个 `application.yml`）
#      ⇒ 本文件生效 ⇒ ⇒ 它 import 的 `application-like.yml` 生效 ⇒ 配置完整。
#   ② **合并进程**（classpath 上 boot 模块的 `application.yml` 在**依赖 jar 之前**）
#      ⇒ **只加载 boot 那一份**（`classpath:/` 优先于 jar 内）
#      ⇒ ⇒ 本文件**不生效**（也不需要）⇒ ⇒ boot 那份负责 import 全部域的真配置。
#
# 【⚠️ 本文件不得写任何真实配置】—— 任何键写在这里都**只在形态 ① 生效** ⇒
#   ⇒ 而形态 ② 下它被忽略 ⇒ ⇒ **同一份配置在两种形态下行为不同** ⇒ 严禁。
# =============================================================================
spring:
  config:
    import:
      - classpath:application-like.yml
