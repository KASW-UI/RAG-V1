# ─────────────────────────────────────────────────────────────────────────────
# like 域测试 profile 配置（api + rpc 合并后的单一进程 · D1）
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️ **为什么这里必须自带密钥**（fail-closed 纪律）：
#   主配置 `application.yml` 里
#     like-api.user-auth.access-secret: ${USER_JWT_SECRET}
#   **没有明文默认值** ⇒ 环境变量没设时启动即失败（这是 B 侧的 fail-closed，
#   **不得**在本仓偷偷加默认值）⇒ ⇒ 测试必须**自带**密钥，否则整个测试上下文起不来。
#
# ⚠️ **前缀必须是 `like-api.`**（不是 `like.`）：
#   · `like-api.user-auth.*` ⇒ {@code LikeApiProperties}（prefix = "like-api"）
#   · `like.redis.*` / `like.kafka.*` / `like.fact.*` / `like.authority.*`
#     ⇒ {@code LikeRpcProperties}（prefix = "like"）
#   ⇒ 两个前缀在同一份 yml 里**共存**（B 侧 api 与 rpc 是两份 yml，D1 合并成一份）。
#
# ⚠️ 本文件是 **test scope**（只进 target/test-classes）⇒ **不进产物 jar**
#    ⇒ ⇒ 生产 / 部署**拿不到**这个默认值 ⇒ ⇒ 生产必须由环境变量提供。
#
# ⚠️ 值必须与测试里签发 token 的常量一致
#    （`com.rag.like.support.LikeTestSupport#SECRET`）⇒ 否则验签必失败（401）。
# ⚠️ **长度 36 字节**（UUID 形态）：jjwt 要求 HMAC 密钥 ≥32 字节
#    ⇒ 共享层 `JwtUtil.padToHmacKeySize` 会补齐 ⇒ 长度本身是被测的不变量。
like-api.user-auth.access-secret=5b7d3f19-8c2a-4e64-b0d5-1f3a9c7e2d48

# 主 yml 里 `${USER_JWT_SECRET}` 的解析源（防止任何一处读到未解析的占位符字面量）
USER_JWT_SECRET=5b7d3f19-8c2a-4e64-b0d5-1f3a9c7e2d48

# ─────────────────────────────────────────────────────────────────────────────
# gRPC：**不起 TCP 端口**
#   `grpc.server.port=-1` ⇒ devh 的 `ConditionalOnInterprocessServer` 不匹配
#   ⇒ **netty server 不创建** ⇒ 不占 TCP 端口 ⇒ 多测试上下文并存时**不撞端口**。
#
# ⚠️ **默认不起 in-process server**：gRPC 的 in-process server 名字是 **JVM 内全局注册**的
#    ⇒ 多个 Spring 上下文用同一个名字 ⇒ 第二个起不来
#    ⇒ ⇒ 只有需要真 gRPC 的测试类才在**自己的** `@SpringBootTest(properties=...)` 里指定唯一名字。
# ─────────────────────────────────────────────────────────────────────────────
grpc.server.port=-1

# ─────────────────────────────────────────────────────────────────────────────
# Kafka：**不真连 broker**（本轮无 Kafka 容器）
#   ⚠️ 主 yml 的 `spring.kafka.bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}`
#      ⇒ 默认会去解析主机名 `kafka` ⇒ 本机没有 ⇒ **每次启动抛 UnknownHostException 栈**（噪声）。
#   ⇒ 指向一个关闭的本机端口 ⇒ 连接**立即被拒**（毫秒级）⇒ 不解析 DNS、不产生噪声。
#
# ⚠️ `max.block.ms=1000` 是**必需**的：没有 broker 时 `KafkaTemplate#send` 会等
#    `max.block.ms`（默认 **60s**）去拉 metadata ⇒ 测试会**卡 60 秒**。
#    压到 1s ⇒ `send` 抛 `TimeoutException` ⇒ 被
#    `LikeDomainService.KafkaLikeMsgPublisher#publish` 的 catch 吞掉
#    ⇒ 记 `KAFKA_ERROR` 指标、**不改变 HTTP 响应**（与 Go 的「Push 失败只 logx.Error」同形）。
#
# ⚠️ **原 `spring.kafka.listener.auto-startup=false` 已删除（2026-11-03）——它是一条死配置。**
#    原注释写的是「消费者不启动 ⇒ 消费路径不在覆盖内」——**这个归因是错的**：
#      · 应用在 `LikeServiceApplication#kafkaListenerContainerFactory` 里**自己 new** 了
#        `ConcurrentKafkaListenerContainerFactory` ⇒ Boot 的
#        `ConcurrentKafkaListenerContainerFactoryConfigurer` **不参与**
#        ⇒ `spring.kafka.listener.*` **一整族键都没有消费点**（AGENTS §3.3.1）；
#      · ⇒ `autoStartup` 取框架默认值 **true** ⇒ **listener 一直都在起**，
#        只是 broker 不可达 ⇒ 一直重试（实测：全仓**没有任何** `setAutoStartup(...)` 调用）；
#      · ⇒ 真正让消费路径零覆盖的原因是 **broker 不可达**，**不是** listener 没起。
#    ⇒ 删除它**不改变任何行为**（它本来就不生效）⇒ 删的是「看起来像开关」的误导。
#    ⇒ 真正覆盖消费面的测试见 `messaging/LikeKafkaThreeFaceRealTest`
#       （它把 `bootstrap-servers` 指向真 broker，并自带测试专属 consumer group）。
# ⚠️ 不要把这一族键再加回来当「消费者开关」用 —— 加了也不生效。
# ─────────────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=127.0.0.1:1
spring.kafka.producer.properties.max.block.ms=1000

# ─────────────────────────────────────────────────────────────────────────────
# 🔴 **discovery 的 `message-rpc` ⇒ 放在全局（不是某个测试类的 properties）**
#
# ⚠️ **为什么必须在全局**：devh 的 gRPC **名字解析器注册进全局静态的**
#    `io.grpc.NameResolverRegistry` ⇒ ⇒ **resolver 持有的是「第一个创建它的
#    Spring 上下文」里的 `DiscoveryClient` bean** ⇒ ⇒ 别的上下文里再配
#    `spring.cloud.discovery.client.simple.instances.*` **对该 resolver 无效**
#    ⇒ ⇒ 现象：`No servers found for message-rpc`（**只在全量回归里出现**，
#    单独跑那个测试类是绿的）⇒ ⇒ **跨上下文串味**。
# ⇒ ⇒ 把这族键放在**所有**上下文都读得到的地方 ⇒ 无论哪个上下文先起，
#    resolver 手里的 `DiscoveryClient` 都含 `message-rpc`。
#
# 📌 指向 `127.0.0.1:18221` = 本域测试自带的**假 message-rpc**（真 netty server，
#    见 `support/FakeMessageRpcServer`）⇒ **不碰 Nacos、不依赖外部容器**。
# ⚠️ 别的测试上下文里那个端口没人监听 ⇒ 解析得到、连不上 ⇒ **无副作用**
#    （like 域只有 `MessageRpcClient` 一个出向调用点，且只被 `notifyArticleLiked` 用）。
# ─────────────────────────────────────────────────────────────────────────────
spring.cloud.discovery.client.simple.instances.message-rpc[0].host=127.0.0.1
spring.cloud.discovery.client.simple.instances.message-rpc[0].port=18221

# ─────────────────────────────────────────────────────────────────────────────
# OTLP exporter：**指向一个关闭的本机端口**
#   主 yml 的 `otel.exporter.otlp.endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}`
#   ⇒ 默认会去解析主机名 `jaeger` ⇒ 本机没有 ⇒ **每次启动抛 UnknownHostException 栈**（噪声，且拖慢启动）。
#   ⇒ 测试里指向 127.0.0.1:1 ⇒ 连接**立即被拒**（毫秒级）⇒ 不解析 DNS、不产生噪声。
#   ⚠️ 这只影响**测试**：OTLP 导出不是被测对象（被测的是 like 域的 HTTP/gRPC/DB 契约）。
# ─────────────────────────────────────────────────────────────────────────────
otel.exporter.otlp.endpoint=http://127.0.0.1:1

# ─────────────────────────────────────────────────────────────────────────────
# Nacos：**不连真 Nacos**
#   域内 `wiring/NacosRegistration` 依赖 `NacosServiceManager` ⇒ 真实现会去连
#   `${NACOS_ADDR:nacos}:${NACOS_PORT:8848}` ⇒ 本机没有 `nacos` 主机 ⇒ 启动期噪声。
#   ⇒ 测试用 `support/NacosStubConfiguration` 把 `getNamingService()` 换成空操作 mock
#      ⇒ **不碰网络**，但域内那个 bean **照常被创建**（它的构造契约仍被真实校验）。
#   ⚠️ 这里再关掉自动注册 ⇒ 双重保险（自动注册一旦生效 ⇒ 会去连 Nacos）。
# ─────────────────────────────────────────────────────────────────────────────
spring.cloud.nacos.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
