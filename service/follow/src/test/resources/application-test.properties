# ─────────────────────────────────────────────────────────────────────────────
# follow 域测试 profile 配置（api + rpc 合并后的单一进程 · D1）
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️ **为什么这里必须自带密钥**（fail-closed 纪律）：
#   主配置 `application.yml` 里
#     follow-api.user-auth.access-secret: ${USER_JWT_SECRET}
#     follow.user-auth.access-secret:     ${USER_JWT_SECRET}   ← 见下方说明
#   **没有明文默认值** ⇒ 环境变量没设时启动即失败（这是 B 侧的 fail-closed，
#   **不得**在本仓偷偷加默认值）⇒ ⇒ 测试必须**自带**密钥，否则整个测试上下文起不来。
#
# ⚠️ **两个前缀并存**（与 users 域同款：`user-api:` / `user-rpc:`）：
#   · `follow-api.user-auth.*` ⇒ {@code FollowApiProperties}（prefix = follow-api）
#   · `follow.list.*` / `follow.recommend.*` ⇒ {@code FollowRpcProperties}（prefix = follow）
#   ⇒ 本文件必须写 **`follow-api.`** 前缀（那才是 JWT 密钥真正被读的地方）。
#
# ⚠️ 本文件是 **test scope**（只进 target/test-classes）⇒ **不进产物 jar**
#    ⇒ ⇒ 生产 / 部署**拿不到**这个默认值 ⇒ ⇒ 生产必须由环境变量提供。
#
# ⚠️ 值必须与测试里签发 token 的常量一致
#    （`com.rag.follow.support.FollowTestSupport#SECRET`）⇒ 否则验签必失败（401）。
# ⚠️ **长度 36 字节**（UUID 形态）：jjwt 要求 HMAC 密钥 ≥32 字节
#    ⇒ 共享层 `JwtUtil.padToHmacKeySize` 会补齐 ⇒ 长度本身是被测的不变量。
follow-api.user-auth.access-secret=ae0536f9-6450-4606-8e13-5a19ed505da0

# 主 yml 里 `${USER_JWT_SECRET}` 的解析源（防止任何一处读到未解析的占位符字面量）
USER_JWT_SECRET=ae0536f9-6450-4606-8e13-5a19ed505da0

# ─────────────────────────────────────────────────────────────────────────────
# gRPC：**不起 TCP 端口**
#   `grpc.server.port=-1` ⇒ devh 的 `ConditionalOnInterprocessServer` 不匹配
#   ⇒ **netty server 不创建** ⇒ 不占 TCP 端口 ⇒ 多测试上下文并存时**不撞端口**。
#
# ⚠️ **默认不起 in-process server**：gRPC 的 in-process server 名字是 **JVM 内全局注册**的
#    （`IOException: name already registered`）⇒ 多个 Spring 上下文用同一个名字 ⇒ 第二个起不来
#    ⇒ ⇒ 只有需要真 gRPC 的测试类才在**自己的** `@SpringBootTest(properties=...)` 里指定唯一名字。
# ⚠️ in-process server **仍然是真 gRPC server**：starter 的 `GrpcServiceDiscoverer` 扫描
#    `@GrpcService` → 注册 service definition → 真实分发 + **真实的拦截器链**
#    （共享层 `ProtectionAutoConfiguration#seaGrpcServerConfigurer` 挂的那条）。
# ─────────────────────────────────────────────────────────────────────────────
grpc.server.port=-1

# ─────────────────────────────────────────────────────────────────────────────
# OTLP exporter：**指向一个关闭的本机端口**
#   主 yml 的 `otel.exporter.otlp.endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}`
#   ⇒ 默认会去解析主机名 `jaeger` ⇒ 本机没有 ⇒ **每次启动抛 UnknownHostException 栈**（噪声，且拖慢启动）。
#   ⇒ 测试里指向 127.0.0.1:1 ⇒ 连接**立即被拒**（毫秒级）⇒ 不解析 DNS、不产生噪声。
#   ⚠️ 这只影响**测试**：OTLP 导出不是被测对象（被测的是 follow 域的 HTTP/gRPC/DB 契约）。
# ─────────────────────────────────────────────────────────────────────────────
otel.exporter.otlp.endpoint=http://127.0.0.1:1
