# ─────────────────────────────────────────────────────────────────────────────
# comment 域测试 profile 配置（api + rpc 合并后的单一进程 · D1）
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️ **为什么这里必须自带密钥**（fail-closed 纪律）：
#   主配置 `application.yml` 里
#     comment-api.user-auth.access-secret: ${USER_JWT_SECRET}
#   **没有明文默认值** ⇒ 环境变量没设时启动即失败（这是 B 侧的 fail-closed，
#   **不得**在本仓偷偷加默认值）⇒ ⇒ 测试必须**自带**密钥，否则整个测试上下文起不来。
#   ⚠️ 另一半由**代码守卫**挡：`config/CommentApiProperties#verifyAccessSecret`
#      （@PostConstruct）显式拒「未解析的占位符原文」与「空串」两种值。
#
# ⚠️ **前缀必须按本域实际的 `@ConfigurationProperties` 前缀写**（共三段，逐字对照）：
#   · `comment-api.*` ⇒ {@code config/CommentApiProperties}（prefix = "comment-api"）
#     —— 本文件用到的只有 `comment-api.user-auth.access-secret`；
#   · `comment.*`     ⇒ {@code config/CommentRpcProperties}（prefix = "comment"）
#     —— 子段 `kafka` / `fact` / `authority` / `sensitive-words`；
#     ⚠️ 主 yml 已给出全部取值（且 `sensitive-words` / `audit-topic` / `audit-concurrency`
#        是 **L1 契约** ⇒ **不许**在这里覆盖）；
#   · `comment.kafka.*` ⇒ {@code messaging/CommentKafkaTopics}（prefix = "comment.kafka"）
#     —— 与上面那个 `comment.kafka` 段**绑定同一段 yaml**（B 侧就是两份类绑一段）。
#   ⇒ 三段前缀在同一份 yml 里**共存**（B 侧 api 与 rpc 是两份 yml，D1 合并成一份）。
#
# ⚠️ 本文件是 **test scope**（只进 target/test-classes）⇒ **不进产物 jar**
#    ⇒ ⇒ 生产 / 部署**拿不到**这个默认值 ⇒ ⇒ 生产必须由环境变量提供。
#
# ⚠️ 值必须与测试里签发 token 的常量一致
#    （`com.rag.comment.support.CommentTestSupport#SECRET`）⇒ 否则验签必失败（401 空 body）。
# ⚠️ **长度 36 字节**（UUID 形态）：jjwt 0.12 要求 HMAC 密钥 ≥32 字节
#    ⇒ 36 字节天然满足 ⇒ 本域**不依赖**共享层 `JwtUtil.padToHmacKeySize` 的补齐逻辑。
comment-api.user-auth.access-secret=7c4e2a91-3d68-4f0b-9a52-6e1c74b8d305

# 主 yml 里 `${USER_JWT_SECRET}` 的解析源（防止任何一处读到未解析的占位符字面量）
USER_JWT_SECRET=7c4e2a91-3d68-4f0b-9a52-6e1c74b8d305

# ─────────────────────────────────────────────────────────────────────────────
# gRPC：**不起 TCP 端口**
#   `grpc.server.port=-1` ⇒ devh 的 `ConditionalOnInterprocessServer` 不匹配
#   ⇒ **netty server 不创建** ⇒ 不占 TCP 端口 ⇒ 多测试上下文并存时**不撞端口**。
#
# ⚠️ **默认不起 in-process server**：in-process server 的名字是 **JVM 内全局注册**的
#    ⇒ 多个 Spring 上下文用同一个名字 ⇒ 第二个起不来
#    ⇒ ⇒ 只有需要真 gRPC 的测试类才在**自己的** `@SpringBootTest(properties=...)` 里指定唯一名字。
#
# 📌 **实测依据（2026-11-04 · devh grpc-server-spring-boot-starter 3.1.0.RELEASE）**：
#   `ConditionalOnInterprocessServer` 继承 `NoneNestedConditions`，
#   其嵌套条件 `NoServerPortCondition` = `@ConditionalOnProperty(name="grpc.server.port", havingValue="-1")`
#   ⇒ ⇒ `port=-1` ⇒ 嵌套条件**匹配** ⇒ 整体**不匹配**
#   ⇒ ⇒ `GrpcServerFactoryAutoConfiguration#nettyGrpcServerFactory` 不创建
#   ⇒ ⇒ `GrpcServerLifecycle` 也不创建 ⇒ **既没有 TCP 端口，也没有 in-process server**。
# ─────────────────────────────────────────────────────────────────────────────
grpc.server.port=-1

# ─────────────────────────────────────────────────────────────────────────────
# Kafka：**不真连 broker**（本轮无 Kafka 容器）
#   ⚠️ 主 yml 的 `spring.kafka.bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}`
#      ⇒ 默认会去解析主机名 `kafka` ⇒ 本机没有 ⇒ **每次启动抛 UnknownHostException 栈**（噪声）。
#   ⇒ 指向一个关闭的本机端口 ⇒ 连接**立即被拒**（毫秒级）⇒ 不解析 DNS、不产生噪声。
#
# ⚠️ `max.block.ms=1000` 是**必需**的：没有 broker 时 `KafkaTemplate#send` 会等
#    `max.block.ms`（默认 **60s**）去拉 metadata ⇒ 测试会**卡 60 秒**。
#    压到 1s ⇒ 发送在 1s 内失败。
#
# 🔴 **失败的后果与 like 域方向相反 —— 不可照抄 like 那段注释**：
#    comment 域的生产端是 `messaging/CommentAuditPublisher#publish`，它
#    **同步等待** future 结果（`future.get(10s)`）⇒ 发送失败 ⇒ 抛
#    `PublishFailed`（业务码 **5009**）⇒ ⇒ **CreateComment 会失败**。
#    这与 B 侧一致（Go 侧 `create_comment_logic.go:126-132`：
#    `kq.Pusher.Push` 失败 ⇒ `errmsg.ErrorKafkaPush` = 5009 ⇒ 返回给客户端）。
#    ⚠️ like 域是**反**的：like 把 Kafka 失败**吞掉**（只记 `KAFKA_ERROR` 指标、
#       **不改变** HTTP 响应）⇒ ⇒ 两域期望值不同，测试不可跨域照抄。
#
# ⚠️ **不加 `spring.kafka.listener.auto-startup=false`** —— 它是一条**死配置**。
#    本域的应用在 `CommentServiceApplication#kafkaListenerContainerFactory`
#    （`CommentServiceApplication.java:133-146`）里**自己 new** 了
#    `ConcurrentKafkaListenerContainerFactory` ⇒ Boot 的
#    `ConcurrentKafkaListenerContainerFactoryConfigurer` **不参与**
#    ⇒ `spring.kafka.listener.*` **一整族键都没有消费点**（AGENTS §3.3.1）；
#    ⇒ ⇒ `autoStartup` 取框架默认值 **true** ⇒ **listener 一直都在起**，
#       只是 broker 不可达 ⇒ 一直重试；
#    ⇒ ⇒ 真正让消费路径零覆盖的原因是 **broker 不可达**，**不是** listener 没起。
#    ⇒ 加了它**不改变任何行为**（它本来就不生效）⇒ 加的是「看起来像开关」的误导。
#    ⚠️ 不要把这一族键当「消费者开关」用 —— 加了也不生效。
# ─────────────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=127.0.0.1:1
spring.kafka.producer.properties.max.block.ms=1000

# ─────────────────────────────────────────────────────────────────────────────
# OTLP exporter：**指向一个关闭的本机端口**
#   主 yml 的 `otel.exporter.otlp.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:jaeger:4317}`
#   ⇒ 默认会去解析主机名 `jaeger` ⇒ 本机没有 ⇒ **每次启动抛 UnknownHostException 栈**（噪声，且拖慢启动）。
#   ⇒ 测试里指向 127.0.0.1:1 ⇒ 连接**立即被拒**（毫秒级）⇒ 不解析 DNS、不产生噪声。
#   ⚠️ 这只影响**测试**：OTLP 导出不是被测对象（被测的是 comment 域的 HTTP/gRPC/DB 契约）。
#
# ⚠️ **不加 `management.otlp.tracing.export.enabled=false`** —— 本仓**没有**
#    `micrometer-tracing-bridge-otel`（实测：根 pom / common pom / comment pom 均无）
#    ⇒ ⇒ 那一族键**没有消费点**（AGENTS §3.3.1）⇒ 加了就是「写了但没人读」的死配置。
# ─────────────────────────────────────────────────────────────────────────────
otel.exporter.otlp.endpoint=http://127.0.0.1:1

# ─────────────────────────────────────────────────────────────────────────────
# Nacos：**不连真 Nacos**
#   域内 `wiring/NacosRegistration` 依赖 `NacosServiceManager` ⇒ 真实现会去连
#   `${NACOS_ADDR:nacos}:${NACOS_PORT:8848}` ⇒ 本机没有 `nacos` 主机 ⇒ 启动期噪声。
#   ⇒ 测试用 `support/NacosStubConfiguration` 把 `getNamingService()` 换成空操作 mock
#      ⇒ **不碰网络**，但域内那个 bean **照常被创建**（它的构造契约仍被真实校验）。
#   ⚠️ 这里再关掉自动注册 ⇒ 双重保险（自动注册一旦生效 ⇒ 会去连 Nacos）。
#   ⚠️ 主 yml 里 `spring.cloud.nacos.discovery.register-enabled: false` 已经关掉了
#      **Nacos 自动注册**（本域的注册是手写的，用 gRPC 端口）—— 这里是**再关一层**
#      `discovery.enabled`（整个 Nacos 发现客户端不装配），两者不重复。
# ─────────────────────────────────────────────────────────────────────────────
spring.cloud.nacos.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ **本文件刻意没有 `spring.cloud.discovery.client.simple.instances.*`**
#
# 📌 **为什么 like 域有、comment 域没有**：like 域有**一个**出向 gRPC 客户端
#    （`@GrpcClient("message-rpc")`）⇒ 它需要 `simple.instances` 才能被解析到。
#    ⚠️ **但 comment 域其实也有两个**（`client/MessageRpcClient` 的 `@GrpcClient("message-rpc")`
#    ＋ `client/ArticleRpcClient` 的 `@GrpcClient("article-rpc")`，地址分别是
#    `discovery:///message-rpc` / `discovery:///article-rpc`，见主 yml）。
#    ⇒ ⇒ 派工口径是「本域没有跨域 gRPC 出向调用」—— **与代码现状不符**；
#    ⇒ ⇒ 本轮按派工**不加**这两族键。
#
# ⚠️ **后果（后续 worker 必读）**：**上下文起得来**（devh 的名字解析是
#    **调用时**才解析实例的，不是启动期），但**真去调用**出向 gRPC 的测试会拿到
#    `No servers found for message-rpc` / `No servers found for article-rpc`。
#    ⇒ ⇒ 那类测试需要**单独拍板**：像 like 域那样把
#    `spring.cloud.discovery.client.simple.instances.<name>[0].host/port`
#    放到**全局**（本文件）—— ⚠️ **放进某个测试类自己的 `@SpringBootTest(properties=…)`
#    里无效**：devh 的 gRPC 名字解析器注册进**全局静态**的 `io.grpc.NameResolverRegistry`
#    ⇒ ⇒ resolver 持有的是「**第一个**创建它的 Spring 上下文」里的 `DiscoveryClient` bean
#    ⇒ ⇒ 后起的上下文再配这些键对该 resolver 无效（like 域踩过：现象只在全量回归里出现，
#    单独跑那个测试类是绿的）。
# ─────────────────────────────────────────────────────────────────────────────
